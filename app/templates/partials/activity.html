<div id="activity-content"><div class="list-group list-group-flush">
{% for initials, color, title, text, time in activities %}<div class="list-group-item px-0"><div class="d-flex gap-3"><span class="avatar bg-{{ color }}-lt">{{ initials }}</span><div class="flex-fill"><div class="fw-medium small">{{ title }}</div><div class="text-secondary small mt-1">{{ text }}</div><div class="activity-time">{{ time }}</div></div></div></div>{% endfor %}
</div><button class="btn btn-link w-100 mt-2" hx-get="/partials/activity?expanded={{ 'false' if expanded else 'true' }}" hx-target="#activity-content" hx-swap="outerHTML">{{ 'Свернуть' if expanded else 'Показать всю активность' }} <span class="htmx-indicator spinner-border spinner-border-sm ms-2"></span></button></div>
