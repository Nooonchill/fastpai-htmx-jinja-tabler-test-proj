{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'chart' %}<path d="M4 4v16h17M8 15l4-5 4 3 5-8"/>
{% elif name == 'box' %}<path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 9 9-4M3 8l9 4v10M7 5.7l9 5"/>
{% elif name == 'form' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/>
{% elif name == 'table' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/>
{% elif name == 'bell' %}<path d="M10 20a2 2 0 0 0 4 0M5 17h14l-2-3V9a5 5 0 0 0-10 0v5l-2 3Z"/>
{% elif name == 'search' %}<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>
{% elif name == 'moon' %}<path d="M20.8 13a9 9 0 1 1-9.8-9.8A7 7 0 0 0 20.8 13Z"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
{% elif name == 'up' %}<path d="m5 15 7-7 7 7M12 8v12"/>
{% elif name == 'download' %}<path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'code' %}<path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/>
{% elif name == 'layers' %}<path d="m12 3 10 6-10 6L2 9l10-6Zm-10 12 10 6 10-6M2 12l10 6 10-6"/>
{% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-17a3 3 0 0 1 0 6m4 11v-3a6 6 0 0 0-3-5"/>
{% elif name == 'dots' %}<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'heart' %}<path d="M12 20 4 12a5 5 0 0 1 8-6 5 5 0 0 1 8 6l-8 8Z"/>
{% elif name == 'shield' %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'bolt' %}<path d="m13 2-8 12h7l-1 8 8-12h-7l1-8Z"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>{% endif %}</svg>
{%- endmacro %}
{% macro heading(id, number, title, subtitle) %}<div class="section-heading" id="{{ id }}"><div><div class="eyebrow">{{ number }} / КОМПОНЕНТЫ</div><h2>{{ title }}</h2><p class="text-secondary mb-0">{{ subtitle }}</p></div><a class="back-top" href="#overview" aria-label="Наверх">↑</a></div>{% endmacro %}
{% macro card(title, subtitle='') %}<div class="card h-100"><div class="card-header"><div><h3 class="card-title">{{ title }}</h3>{% if subtitle %}<div class="text-secondary small mt-1">{{ subtitle }}</div>{% endif %}</div></div><div class="card-body">{{ caller() }}</div></div>{% endmacro %}
